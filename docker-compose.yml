version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: claimguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-claimguard}
      POSTGRES_USER: ${DB_USER:-claimguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-claimguard_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - claimguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-claimguard} -d ${DB_NAME:-claimguard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: claimguard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-claimguard}
      DB_USER: ${DB_USER:-claimguard}
      DB_PASSWORD: ${DB_PASSWORD:-claimguard_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: claimguard-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  claimguard-pgdata:
